name: minimax-h3-relayvsr
# EXPERIMENT (2026-11-08): the deployed minimax-h3 image (model.yaml @ 59dec0e, feature/minimax-h3-realism-lora)
# plus RelayVSR x2 in the SAME ComfyUI, so a clip can be rendered on a smaller canvas and upscaled in one graph
# (MiniMax VAEDecode -> RelayVSRConditioning -> KSampler 1 step -> VSRDecode -> CreateVideo). Used to measure
# the generate-small-then-upscale cost/quality trade-off against native 768p. Not a production image: it
# overlays ComfyUI master (patches/upgrade-comfyui.py) because no tagged release has the RelayVSR nodes yet.
# Everything below the marker is the deployed minimax-h3 definition, unchanged.
#
# ----- RelayVSR additions -----
# NOTE (2026-11-08): the deployed yaml's Civitai LoRAs are NOT baked here — Civitai returned an HTTP error for
# model 3285598 (MM-H3_Blowjob_v3) during the build, which would also break a full rebuild of minimax-h3 itself.
# They play no part in the upscale measurements.
# ----- deployed minimax-h3 model.yaml (59dec0e) follows -----
# MiniMax H3 — text-to-video, first/last-frame image-to-video, reference-to-video,
# multiframe reference (chained MiniMaxH3AddGuide) and character swap (ref2va + the Akatz
# Character Swap LoRA, source clip as a reference video), all with native stereo audio
# (https://docs.comfy.org/tutorials/video/minimax/minimax-h3).
#
# ALL nodes are ComfyUI CORE: MiniMaxH3ImageToVideo (t2va when no first_frame is
# connected, fl2va when one is), MiniMaxH3ReferenceToVideo (ref2va — a SEPARATE
# diffusion model file), MiniMaxH3AddGuide (multiframe anchors, ComfyUI >= 0.37.0),
# CLIPLoader type=minimax, VAEDecodeAudio, CreateVideo, SaveVideo. No custom nodes.
#
# REQUIREMENTS (both come from the shared base, not this file):
#   * ComfyUI >= 0.30.0 — the MiniMax H3 nodes landed in comfyanonymous/ComfyUI#15224
#     (merged 2026-08-03). Symptom on an older base: "Node 'MiniMaxH3ImageToVideo' not found".
#   * CUDA 13 base (nvidia/cuda:13.0.3 + torch cu130). comfy/quant_ops.py calls
#     ck.registry.disable("cuda") when torch.version.cuda < 13, so the int8_convrot
#     unet and the nvfp4 text encoder fall back to the slow dequant path on cu128.
#   * A C compiler in the base (gcc + libc6-dev, added to base/Dockerfile 2026-09-22).
#     The quantized path runs Triton kernels, and Triton compiles a C launcher stub
#     per kernel at runtime. Symptom on an older base: the MiniMaxH3ImageToVideo node
#     fails with "Failed to find C compiler. Please specify via CC environment variable".
#   Build order:
#     MODEL=base COMFYUI_VERSION=latest bash build.sh
#     MODEL=minimax-h3 bash build.sh
#
# Sampling is fixed by the apps (opensourcegen + pixel-dream server/models/minimax-h3.js):
# fl2va: 8-step turbo LoRA @1.0; ref2va: 4-step turbo LoRA @1.0 (+ the NSFW LoRA
# when the prompt is sexual enough, + up to 2 user-picked LoRAs); both res_multistep /
# simple, BasicGuider (no CFG, no negative prompt), 24 fps, 768p canvas (short edge
# 768, area <= 768*1344, /32), length on the model's 17k+5 frame grid (124 = ~5 s ...
# 362 = ~15 s). character-swap: ref2va + Character Swap LoRA @1.0, 20 full steps, length
# follows the source clip (56 f = ~2.3 s ... 362 f).
#
# LICENSE: Comfy-Org/MiniMax-H3 is published under the
# minimax-h3-community-license-agreement. The Comfy docs state that commercial use
# of locally generated outputs requires a MiniMax commercial license (sold via
# Comfy). Operator's responsibility.

# Output frame rate (pixel-dream settings.fps 24/30/50/60): the model always renders 24 fps;
# higher rates run core FrameInterpolate (RIFE v4.26, x5 -> 120 fps, ComfyUI >= 0.20) and then
# VHS_SelectImages picks the target-rate frames from a server-computed index list before CreateVideo.
custom_nodes:
  - repo: https://github.com/Kosinkadink/ComfyUI-VideoHelperSuite # VHS_SelectImages (frame-rate resample)
    ref: 4d907bee61e92c2e65af3bd6383a4e4d356126d1                   # 2026-09-02

model_downloads:
  # All files are public on Hugging Face — no HUGGINGFACE_ACCESS_TOKEN required.
  # apply_model_config.py flattens each `filename` to its basename on download;
  # the app's workflow builder references these basenames. ~67.5 GB total.

  # Diffusion model — fl2va (first/last-frame + text), pruned, int8 convrot. 20.97 GB.
  # Loaded by core UNETLoader. Comfy-Org: prefer int8_convrot over fp8_scaled on cu130.
  - source: hf
    repo_id: Comfy-Org/MiniMax-H3
    filename: diffusion_models/minimax_h3_fl2va_pruned_int8_convrot.safetensors
    dest: /comfyui/models/diffusion_models/

  # Text encoder — Qwen3-VL 32B, nvfp4 AWQ. 15.69 GB. Loaded by CLIPLoader type=minimax.
  # (nvfp4 does not require a Blackwell GPU.)
  - source: hf
    repo_id: Comfy-Org/MiniMax-H3
    filename: text_encoders/qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors
    dest: /comfyui/models/text_encoders/

  # Video VAE (fp16). 5.21 GB.
  - source: hf
    repo_id: Comfy-Org/MiniMax-H3
    filename: vae/minimax_h3_video_vae_fp16.safetensors
    dest: /comfyui/models/vae/

  # Audio VAE (fp32). 0.61 GB. Decodes the audio half of the joint AV latent.
  - source: hf
    repo_id: Comfy-Org/MiniMax-H3
    filename: vae/minimax_h3_audio_vae_fp32.safetensors
    dest: /comfyui/models/vae/

  # lightx2v turbo LoRA, 8-step variant (bf16, ComfyUI key layout). 1.96 GB.
  # Also mirrored at lightx2v/Minimax-h3-Turbo.
  - source: hf
    repo_id: Comfy-Org/MiniMax-H3
    filename: loras/minimax_h3_fl2v_turbo_8step_v1.0_comfyui_bf16.safetensors
    dest: /comfyui/models/loras/

  # Diffusion model — ref2va (reference images/videos/audio + text), pruned, int8
  # convrot. 20.97 GB. Used by MiniMaxH3ReferenceToVideo (reference-to-video and
  # multiframe reference); the fl2va file above cannot take references.
  - source: hf
    repo_id: Comfy-Org/MiniMax-H3
    filename: diffusion_models/minimax_h3_ref2va_pruned_int8_convrot.safetensors
    dest: /comfyui/models/diffusion_models/

  # lightx2v turbo LoRA for the ref2va model, 4-step variant (bf16). 1.96 GB.
  - source: hf
    repo_id: Comfy-Org/MiniMax-H3
    filename: loras/minimax_h3_ref2v_turbo_4step_v0.1_comfyui_bf16.safetensors
    dest: /comfyui/models/loras/

  # lightx2v turbo LoRA for ref2va, 8-step v1.0 trained at 768p (1344x768, video shift 6 /
  # audio shift 3 per the model card's 768p rows). Candidate replacement for the 4-step v0.1
  # (trained at 544p, shift 12) — 2026-09-29 quality investigation. Not on Comfy-Org; lightx2v only.
  - source: hf
    repo_id: lightx2v/Minimax-h3-Turbo
    filename: minimax_h3_ref2v_turbo_8step_v1.0_768p_comfyui_bf16.safetensors
    dest: /comfyui/models/loras/

  # MiniMax H3 NSFW Unlocked (MidLAB) — https://civitai.com/models/2925727
  # (model 2925727 / version 3345855 "M3_V1.1"). Rank-16 LoRA on the 50 blocks'
  # mlp.fc1/fc2 only (fp32, 164 MB). Trained on fl2va (t2v + i2v); fl2va and ref2va
  # share the exact tensor layout, so it also loads on ref2va (reference-to-video,
  # multiframe). Auto-applied by pixel-dream above a prompt sexual score, chained
  # after the turbo LoRA. Author: strength 0.3–1 (0.5 sweet spot).
  - source: hf
    repo_id: fal/MiniMax-H3-Realism-People-LoRA
    filename: h3-realism-people-t2v-i2v-r2v.safetensors
    dest: /comfyui/models/loras/

  # Character Swap LoRA v1 (Akatz Labs) — https://huggingface.co/akatz-ai/MiniMax-H3-Character-Swap-LoRA
  # (repo lastModified 2026-09-27; sha256 4b2a3f42…f79, 155 MB). Rank 16/16 adapter trained on the
  # ref2va int8 base: replaces the person named in the prompt in <Video 1> with the character in
  # <Picture 1> (two-character inference tested upstream, not supervised). Drives the apps'
  # "Character Swap" tool (minimax-h3:character-swap): ref2va + this LoRA @1.0, 20 full steps,
  # the source clip wired into ref_videos.ref_video_0 via VHS_LoadVideo (force_rate 24). No trigger
  # word, no turbo LoRA. License: MiniMax H3 Community License (same as the base), not Apache-2.0.
  - source: hf
    repo_id: akatz-ai/MiniMax-H3-Character-Swap-LoRA
    filename: h3_character_swap_pro4500_1000.safetensors
    dest: /comfyui/models/loras/

  # RIFE v4.26 frame interpolation model (22.7 MB, public) for core FrameInterpolationModelLoader.
  - source: hf
    repo_id: Comfy-Org/frame_interpolation
    filename: frame_interpolation/rife_v4.26.safetensors
    dest: /comfyui/models/frame_interpolation/

  # RelayVSR x2 (LightX2V retrain, int8 convrot, 5.16 GB) + its Flash decoder (fp32, 128 MB). Core nodes.
  - source: hf
    repo_id: Comfy-Org/RelayVSR
    filename: diffusion_models/relayvsr_x2_lightx2v_int8_convrot.safetensors
    dest: /comfyui/models/diffusion_models/
  - source: hf
    repo_id: Comfy-Org/RelayVSR
    filename: vae/relayvsr_flash_vae_x2_fp32.safetensors
    dest: /comfyui/models/vae/

post_install:
  - patches/upgrade-comfyui.py

output:
  type: video   # SaveVideo emits under ComfyUI's "videos" history key
