# CozyGPU desktop variant of minimax-h3: all main weights and both lightx2v turbo LoRAs, built the same way.
# Removed vs models/minimax-h3: the M3_Unlocked_V2.1 (MiniMax H3 NSFW Unlocked) LoRA.
# MiniMax H3 — text-to-video, first/last-frame image-to-video, reference-to-video
# and multiframe reference (chained MiniMaxH3AddGuide), all with native stereo audio
# (https://docs.comfy.org/tutorials/video/minimax/minimax-h3).
# Plus fal/MiniMax-H3-Realism-People-LoRA (SFW, trigger r34l1sm) as the built-in realism pick.
name: minimax-h3-cozy
model_downloads:
- source: hf
  repo_id: Comfy-Org/MiniMax-H3
  filename: diffusion_models/minimax_h3_fl2va_pruned_int8_convrot.safetensors
  dest: /comfyui/models/diffusion_models/
- source: hf
  repo_id: Comfy-Org/MiniMax-H3
  filename: text_encoders/qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors
  dest: /comfyui/models/text_encoders/
- source: hf
  repo_id: Comfy-Org/MiniMax-H3
  filename: vae/minimax_h3_video_vae_fp16.safetensors
  dest: /comfyui/models/vae/
- source: hf
  repo_id: Comfy-Org/MiniMax-H3
  filename: vae/minimax_h3_audio_vae_fp32.safetensors
  dest: /comfyui/models/vae/
- source: hf
  repo_id: Comfy-Org/MiniMax-H3
  filename: loras/minimax_h3_fl2v_turbo_8step_v1.0_comfyui_bf16.safetensors
  dest: /comfyui/models/loras/
- source: hf
  repo_id: Comfy-Org/MiniMax-H3
  filename: diffusion_models/minimax_h3_ref2va_pruned_int8_convrot.safetensors
  dest: /comfyui/models/diffusion_models/
- source: hf
  repo_id: Comfy-Org/MiniMax-H3
  filename: loras/minimax_h3_ref2v_turbo_4step_v0.1_comfyui_bf16.safetensors
  dest: /comfyui/models/loras/
- source: hf
  repo_id: fal/MiniMax-H3-Realism-People-LoRA
  filename: h3-realism-people-t2v-i2v-r2v.safetensors
  dest: /comfyui/models/loras/
output:
  type: video
