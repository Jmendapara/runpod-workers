name: qwen3-tts
# Qwen3-TTS 1.7B (Alibaba Qwen, Apache-2.0 weights, 2026-01): companion voices for Pixel Dream.
# VoiceDesign renders each companion's reference clip once from a text description; Base clones
# that stored clip (+ its exact transcript) for every voice note, so she always sounds the same.
# Nodes: models/qwen3-tts/nodes/pd_qwen3_tts (our own thin wrapper over the official qwen-tts
# package: explicit seed / language / sampling, 24 kHz mono WAV output). Graphs are built in
# pixel-dream server/models/qwen3-tts.js. ~9 GB of weights, bf16 ~8 GB VRAM for both models.
pip_extras:
  # --no-deps: the package pins gradio (demo only) and would otherwise re-resolve torch.
  - "qwen-tts==0.1.1 --no-deps"
  - "transformers==4.57.3"
  - "accelerate==1.12.0"
  - "librosa==0.11.0"
  - soundfile
  - sox
  - onnxruntime
  - einops
model_downloads:
  - source: hf-snapshot
    repo_id: Qwen/Qwen3-TTS-12Hz-1.7B-Base
    dest: /comfyui/models/qwen3-tts/Qwen3-TTS-12Hz-1.7B-Base
  - source: hf-snapshot
    repo_id: Qwen/Qwen3-TTS-12Hz-1.7B-VoiceDesign
    dest: /comfyui/models/qwen3-tts/Qwen3-TTS-12Hz-1.7B-VoiceDesign
post_install:
  - install_nodes.py
  - verify.py
env:
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
output:
  # PDSaveWav writes 24 kHz mono 16-bit WAV itself (the app's waveform peaks + silence padding
  # assume 24 kHz), so no FLAC transcode.
  type: audio
